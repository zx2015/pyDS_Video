[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-video"
version = "0.1.0"
description = "Cross-platform (macOS/Linux) desktop client to browse and play videos from Synology DSM 7.2 via File Station"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "synology-api>=0.9",
    "cryptography>=42",
    "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "requests>=2",
]

[project.scripts]
ds-video = "ds_video.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a real DSM device (see docs/design.md 7.2)",
]
